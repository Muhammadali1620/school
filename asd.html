<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Появление поля ввода</title>
<style>
    /* Стили для центрирования и отображения блока ввода */
    .input-container {
        display: none; /* Начинаем с скрытого состояния */
        margin-top: 10px;
    }
</style>
</head>
<body>



    <button onclick="toggleInput()">Показать поле ввода</button>
    <div id="input-container" class="input-container">
        <input type="text" id="user-input" placeholder="Введите текст">
    </div>



<script>
function toggleInput() {
    var inputContainer = document.getElementById('input-container');
    if (inputContainer.style.display === 'none') {
        inputContainer.style.display = 'block';
    } else {
        inputContainer.style.display = 'none';
    }
}
</script>

</body>
</html>
